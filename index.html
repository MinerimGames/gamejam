<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IsleideVerse</title>

  <link rel="stylesheet" href="styles.css">
  <script src="challenge.js" defer></script>
  <script src="battle.js" defer></script>
</head>

<body>

  <div class="arena">

    <!-- STATUS INIMIGO -->
    <div class="caixa inimigo">
      <div class="caixa-nome">Isleide Newton</div>

      <div class="caixa-level">
        NÍVEL 1
      </div>

      <div class="caixa-vida">
        <span id="vidaInimigo"></span>
      </div>

      <div class="texto-hp">
        HP: <span id="hpInimigo">100</span>/100
      </div>
    </div>

    <!-- STATUS PLAYER -->
    <div class="caixa personagem-status">

      <div class="caixa-nome">Isleide</div>

      <div class="caixa-level">
        NÍVEL 1
      </div>

      <div class="caixa-vida">
        <span id="vidaPlayer"></span>
      </div>

      <div class="texto-hp">
        HP: <span id="hpPlayer">100</span>/100
      </div>

    </div>

    <!-- PLAYER -->
    <div class="personagem">
      <img src="assets/JogadorCostas0.png" alt="Jogador">
    </div>

    <!-- INIMIGO -->
    <div class="inimigo-sprite">
      <img src="assets/Newton0.png" alt="Inimigo">
    </div>

    <!-- MENU 2x2 -->
    <div class="caixa-acoes">

      <button class="botao-acao">
        ATAQUE
      </button>

      <button class="botao-acao">
        CURA
      </button>

      <button class="botao-acao">
        DEFESA
      </button>

      <button class="botao-acao">
        ESQUIVA
      </button>

    </div>

    <!-- POPUP -->
    <div class="popup-overlay">

      <div class="popup">

        <div class="caixa-texto">
          RESOLVA A CONTA!
        </div>

        <div class="desafio-matematico">

          <span id="slotX">?</span>

          <span id="slotOperacao">+</span>

          <span id="slotY">?</span>

        </div>

        <div class="popup-input-area">

          <input
            type="number"
            id="respostaUsuario"
            placeholder="RESPOSTA"
          >

          <button id="btnVerificar" onclick="verificarResposta()">
            OK
          </button>

        </div>

      </div>

    </div>

    <!-- POPUP DE RESULTADO -->
    <div class="resultado-overlay" id="resultadoPopup">
      <div class="resultado-popup" id="textoResultado">
        ACERTOU!
      </div>
    </div>

    <!-- TELA DE VITORIA -->
    <div class="tela-final tela-vitoria" id="telaVitoria">
      <div class="tela-final-caixa">
        <h2>VOCE VENCEU!</h2>
        <p>A batalha acabou por enquanto.</p>
        <button class="botao-retornar" id="btnVoltarVitoria">
          RETORNAR
        </button>
      </div>
    </div>

    <!-- TELA DE DERROTA -->
    <div class="tela-final tela-derrota" id="telaDerrota">
      <div class="tela-final-caixa">
        <h2>VOCE PERDEU!</h2>
        <p>Tenta de novo que agora vai.</p>
        <button class="botao-retornar" id="btnVoltarDerrota">
          RETORNAR
        </button>
      </div>
    </div>

  </div>

</body>

</html>
